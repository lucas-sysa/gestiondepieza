<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina - Asignación de Ingresos</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root { 
      --primary: #1d3557; 
      --success: #2a9d8f; 
      --error: #e63946; 
      --print-btn: #457b9d;
      --bg: #f1faee; 
    }
    
    body { 
      font-family: system-ui, sans-serif; 
      background: var(--bg); 
      margin: 0; 
      padding: 20px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dashboard-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      width: 100%;
      max-width: 1400px;
      margin-top: 10px;
    }

    .card { 
      width: 100%; 
      max-width: 450px; 
      background: white; 
      padding: 25px; 
      border-radius: 8px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      box-sizing: border-box; 
      flex-shrink: 0;
    }

    .card-tabla { 
      flex-grow: 1; 
      width: 100%; 
      max-width: 950px; 
      background: white; 
      padding: 25px; 
      border-radius: 8px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      box-sizing: border-box; 
    }

    h2 { color: var(--primary); margin-top:0; text-align: center; border-bottom: 2px solid #e63946; padding-bottom: 10px;}
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--primary); }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #457b9d; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    
    .status { text-align: center; padding: 10px; margin-top: 15px; border-radius: 4px; display: none; font-weight: bold; }
    .success { display: block; background: #e8f5e9; color: #2e7d32; }
    .error { display: block; background: #ffebee; color: #c62828; }
    .loading-banner { background: #fff3cd; color: #856404; text-align: center; padding: 12px; border-radius: 4px; font-size: 13px; font-weight: bold; width: 100%; max-width: 1360px; box-sizing: border-box; margin-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f1f3f5; color: var(--primary); }
    tr:hover { background-color: #f8f9fa; }
    
    .acciones-celda { display: flex; gap: 8px; }
    .btn-eliminar { background-color: var(--error); color: white; padding: 6px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 0; width: auto; font-weight: bold; }
    .btn-eliminar:hover { background-color: #c62828; }
    
    .btn-imprimir { background-color: var(--print-btn); color: white; padding: 6px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 0; width: auto; font-weight: bold; }
    .btn-imprimir:hover { background-color: #1d3557; }

    .badge-pendiente { background: #fff3cd; color: #856404; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }

    @media (max-width: 1024px) {
      .dashboard-container { flex-direction: column; align-items: center; }
      .card, .card-tabla { max-width: 100%; }
    }
  </style>
</head>
<body>

<div id="loadingBanner" class="loading-banner">🔄 Sincronizando catálogos de materiales y ubicaciones...</div>

<div class="dashboard-container">

  <div class="card">
    <h2>Control de Oficina: Crear Tarea</h2>
    <form id="oficinaForm">
      <div class="form-group">
        <label for="materiaprima">Seleccionar Materia Prima</label>
        <select id="materiaprima" required disabled>
          <option value="">-- Elija un material --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cantidad">Cantidad a Ingresar</label>
        <input type="number" id="cantidad" min="1" value="1" required disabled>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="rack">Calle / Rack Destino</label>
          <select id="rack" required disabled>
            <option value="">-- Calle --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="box">Posición / Box Destino</label>
          <select id="box" required disabled>
            <option value="">-- Box --</option>
          </select>
        </div>
      </div>

      <button type="submit" id="btnAsignar" disabled>ASIGNAR TAREA A HANDHELD</button>
    </form>
    <div id="statusBox" class="status"></div>
  </div>

  <div class="card-tabla">
    <h2>Tareas Activas (Pendientes)</h2>
    <table>
      <thead>
        <tr>
          <th>ID Tarea</th>
          <th>Código MP</th>
          <th>Descripción</th>
          <th>Cantidad</th>
          <th>Ubicación</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaTareas">
        <tr><td colspan="7" style="text-align: center; color: #666;">Cargando tareas activas...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbyZlEck5rqAxp1c_oYmB0hqzyeOP3ozWRkbn0-4Aa-mnFE8YAfqlm4JEYdaV7roNHAMXQ/exec";

  let LISTA_MATERIALES = [];
  let LISTA_UBICACIONES = [];
  let LISTA_TAREAS_ACTIVAS = [];

  const selectMP = document.getElementById('materiaprima');
  const selectRack = document.getElementById('rack');
  const selectBox = document.getElementById('box');
  const loadingBanner = document.getElementById('loadingBanner');
  const statusBox = document.getElementById('statusBox');
  const btnAsignar = document.getElementById('btnAsignar');
  const cuerpoTablaTareas = document.getElementById('cuerpoTablaTareas');

  function renderizarTablaTareas() {
    if (LISTA_TAREAS_ACTIVAS.length === 0) {
      cuerpoTablaTareas.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #666;">No hay tareas pendientes en este momento.</td></tr>';
      return;
    }

    cuerpoTablaTareas.innerHTML = "";
    LISTA_TAREAS_ACTIVAS.forEach(tarea => {
      const tr = document.createElement('tr');
      
      // Sanitización rápida de descripción para pasarla sin problemas por atributo
      const descSanitizada = tarea.desc.replace(/'/g, "&#39;").replace(/"/g, "&quot;");

      tr.innerHTML = `
        <td><small>${tarea.id}</small></td>
        <td><strong>${tarea.codigo}</strong></td>
        <td>${tarea.desc}</td>
        <td>${tarea.cant}</td>
        <td><small>${tarea.rack} - ${tarea.box}</small></td>
        <td><span class="badge-pendiente">PENDIENTE</span></td>
        <td class="acciones-celda">
          <button class="btn-imprimir" onclick="imprimirEtiqueta('${tarea.id}', '${tarea.codigo}', '${descSanitizada}', '${tarea.cant}')">🖨️ Etiqueta</button>
          <button class="btn-eliminar" onclick="eliminarTarea('${tarea.id}')">❌</button>
        </td>
      `;
      cuerpoTablaTareas.appendChild(tr);
    });
  }

  // FUNCIÓN REVOLUCIONARIA: Abre una ventana de impresión limpia con los códigos de barra formateados
  function imprimirEtiqueta(id, codigo, desc, cantidad) {
    const ventanaImpresion = window.open('', '_blank', 'width=600,height=600');
    
    ventanaImpresion.document.write(`
      <html>
      <head>
        <title>Imprimir Etiqueta - Tarea ${id}</title>
        <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
        <style>
          body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            color: #000; 
            text-align: center;
          }
          .etiqueta-box {
            border: 2px dashed #000;
            padding: 15px;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 5px;
            box-sizing: border-box;
          }
          .header-info {
            font-size: 14px;
            margin-bottom: 12px;
            text-align: left;
            border-bottom: 1px solid #000;
            padding-bottom: 6px;
          }
          .header-info div { margin-bottom: 4px; }
          .barcode-section {
            margin: 15px 0;
          }
          .barcode-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 2px;
          }
          svg { width: 100%; max-height: 75px; }
          
          /* Esconder cualquier elemento ajeno al imprimir */
          @media print {
            body { padding: 0; }
            .etiqueta-box { border: none; }
          }
        </style>
      </head>
      <body>
        <div class="etiqueta-box">
          <div class="header-info">
            <div><strong>ID TAREA:</strong> ${id}</div>
            <div><strong>DESCRIPCIÓN:</strong> ${desc}</div>
          </div>
          
          <div class="barcode-section">
            <div class="barcode-title">Código de Materia Prima</div>
            <svg id="barcodeCodigo"></svg>
          </div>
          
          <div class="barcode-section">
            <div class="barcode-title">Cantidad a Ingresar</div>
            <svg id="barcodeCantidad"></svg>
          </div>
        </div>

        <script>
          // Generación de los códigos de barra usando CODE128 estándar e industrial
          JsBarcode("#barcodeCodigo", "${codigo}", {
            format: "CODE128",
            lineColor: "#000",
            width: 2,
            height: 50,
            displayValue: true,
            fontSize: 14
          });

          JsBarcode("#barcodeCantidad", "${cantidad}", {
            format: "CODE128",
            lineColor: "#000",
            width: 2,
            height: 50,
            displayValue: true,
            fontSize: 14
          });

          // Disparar ventana de impresión del sistema automáticamente y cerrar al terminar
          window.onload = function() {
            window.print();
            setTimeout(function() { window.close(); }, 500);
          }
        <\/script>
      </body>
      </html>
    `);
    ventanaImpresion.document.close();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const respuesta = await fetch(URL_API + "?cargarMaestros=true");
      const datos = await respuesta.json();
      
      LISTA_MATERIALES = datos.materiales || [];
      LISTA_UBICACIONES = datos.ubicaciones || [];
      LISTA_TAREAS_ACTIVAS = datos.tareas || [];

      selectMP.innerHTML = '<option value="">-- Elija un material --</option>';
      LISTA_MATERIALES.sort((a,b) => a.codigo.localeCompare(b.codigo)).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.codigo;
        opt.textContent = `${m.codigo} - ${m.desc}`;
        selectMP.appendChild(opt);
      });

      selectRack.innerHTML = '<option value="">-- Calle --</option>';
      const racksUnicos = [...new Set(LISTA_UBICACIONES.map(u => u.rack))].sort();
      racksUnicos.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        selectRack.appendChild(opt);
      });

      renderizarTablaTareas();

      loadingBanner.style.display = 'none';
      document.querySelectorAll('#oficinaForm input, #oficinaForm select').forEach(el => el.disabled = false);
      btnAsignar.disabled = false;

    } catch (err) {
      loadingBanner.style.backgroundColor = '#f8d7da';
      loadingBanner.style.color = '#721c24';
      loadingBanner.textContent = '❌ Error de conexión con el Sheet.';
    }
  });

  selectRack.addEventListener('change', () => {
    const rackSel = selectRack.value;
    selectBox.innerHTML = '<option value="">-- Box --</option>';
    if (rackSel) {
      LISTA_UBICACIONES.filter(u => u.rack === rackSel).map(u => u.box).sort().forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        selectBox.appendChild(opt);
      });
    }
  });

  document.getElementById('oficinaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    btnAsignar.disabled = true;
    statusBox.style.display = 'none';

    const payload = {
      accion: "crearTareaPendiente",
      materiaprima: selectMP.value,
      cantidad: document.getElementById('cantidad').value,
      rack: selectRack.value,
      box: selectBox.value
    };

    try {
      await fetch(URL_API, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      statusBox.textContent = "✔ Tarea subida exitosamente al Sheet.";
      statusBox.className = "status success";
      document.getElementById('cantidad').value = "1";
      selectMP.value = ""; selectRack.value = ""; selectBox.innerHTML = '<option value="">-- Box --</option>';
      
      const respuesta = await fetch(URL_API + "?cargarMaestros=true");
      const datos = await respuesta.json();
      LISTA_TAREAS_ACTIVAS = datos.tareas || [];
      renderizarTablaTareas();
    } catch (err) {
      statusBox.textContent = "❌ Error al guardar tarea.";
      statusBox.className = "status error";
    } finally {
      btnAsignar.disabled = false;
    }
  });

  async function eliminarTarea(idTarea) {
    if (!confirm(`¿Está seguro de que desea eliminar la tarea ${idTarea}?`)) return;

    try {
      await fetch(URL_API, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          accion: "eliminarTarea",
          idTarea: idTarea
        })
      });

      LISTA_TAREAS_ACTIVAS = LISTA_TAREAS_ACTIVAS.filter(t => t.id !== idTarea);
      renderizarTablaTareas();
      alert(`✔ Tarea ${idTarea} removida de la vista.`);
    } catch (error) {
      alert("❌ Error de red al intentar eliminar la tarea.");
    }
  }
</script>
</body>
</html>
